<!DOCTYPE html>
<html>
    <head>
        <title>Mi lista de tareas</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Mi lista de tareas</h1>

        <div class="contenedor-input">
            <input type="text" id="nuevaTarea" placeholder="Escribe una tarea...">
            <button id="agregarTarea">Agregar</button>
        </div>

        <div class="filtros">
            <button class="filtro" data-filtro="todas">Todas</button>
            <button class="filtro" data-filtro="pendientes">Pendientes</button>
            <button class="filtro" data-filtro="completadas">Completadas</button>
        </div>

        <ul id="listaTareas"></ul>

        <p id="contador">Tareas pendientes: 0</p>

        <script src="script.js"></script>
    </body>
</html>
